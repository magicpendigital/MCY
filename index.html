<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fffcf7" />
    <meta name="description" content="Vạn chút an yên. Check-in, chọn một buổi tập nhẹ nhàng và ghi lại hành trình theo cách của bạn." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/assets/welcome-portrait-512.webp" imagesrcset="/assets/welcome-portrait-512.webp 512w, /assets/welcome-portrait-1024.webp 1024w" imagesizes="(min-width: 700px) 450px, 100vw" fetchpriority="high" />
    <title>Một chút yoga</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iOS Safari zooms the page when a text field gets focus. Every field is at least 16px (tests/input-font-size.test.mjs), and this adds
      // maximum-scale=1 on iOS only as a second guard (INC-005): Safari on iOS 10+ still allows pinch zoom, and Android keeps its own zoom.
      // Plain ES5 on purpose.
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          var meta = document.querySelector('meta[name="viewport"]');
          if (ios && meta && !/maximum-scale/.test(meta.getAttribute("content") || "")) meta.setAttribute("content", meta.getAttribute("content") + ", maximum-scale=1");
        } catch (e) { /* the page works without it */ }
      })();
    </script>
    <script>
      // Plain ES5 on purpose: runs on any browser. If the app has not drawn anything after 10 s (for example the browser is too old
      // to parse it), show a readable message instead of a blank page. See docs/quality/KNOWN_INCIDENTS.md, INC-001.
      (function () {
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && !root.firstChild) {
            root.innerHTML = "<div style=\"font:16px/1.5 -apple-system,Roboto,sans-serif;color:#283d31;background:#fffcf7;padding:28px 20px;min-height:100vh;box-sizing:border-box\"><strong style=\"font-size:19px\">Ứng dụng chưa mở được trên trình duyệt này.</strong><p>Hãy kiểm tra kết nối, tải lại trang, hoặc cập nhật iOS / trình duyệt lên bản mới hơn. Nếu vẫn lỗi, xin liên hệ qua trang hướng dẫn của Một chút yoga.</p></div>";
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
