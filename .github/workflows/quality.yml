name: MCY quality baseline

on:
  pull_request:
  # The branch that ships (`main`, deployed as Vercel Preview) also receives direct pushes, so every push must run the baseline too.
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      # check:ios15 = runtime integrity + production build + iOS 15 static checks (source and bundle) + bundle secret scan
      - run: npm run check:ios15
      # One list for agents and CI: scripts/run-suite.mjs (unit = every offline Node test/contract check)
      - run: npm run test:unit
      - run: npm run test:sites
      - run: npm run test:runtime
      # Process hygiene (PLAN.md fresh, plans complete): visible in CI, never a release blocker
      - run: npm run check:plan
        continue-on-error: true
