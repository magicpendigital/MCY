name: MCY quality baseline

on:
  pull_request:
  # The branch that ships (codex-mcy-p1-preview) is never merged through a pull request, so every push must run the baseline too.
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      # check:ios15 = runtime integrity + production build + iOS 15 static checks (source and bundle) + bundle secret scan
      - run: npm run check:ios15
      - run: npm run test:skills
      - run: npm run test:agents-size
      - run: npm run test:dependency-security
      - run: npm run test:checkin-migration-contract
      - run: npm run test:consent-event-migration-contract
      - run: npm run test:ai-gateway
      - run: npm run test:owner-control-plane
      - run: npm run test:practice-assistant
      - run: npm run test:practice-catalog
      - run: npm run test:content-review
      - run: npm run test:reading-publication
      - run: npm run test:content-workspace
      - run: npm run test:content-publication
      - run: npm run check:video-catalog
      - run: npm run test:owner-conflict-migration-contract
      - run: npm run test:teacher-control-plane
      - run: npm run test:teacher-migration-contract
      - run: npm run test:sites
      - run: npm run test:runtime
